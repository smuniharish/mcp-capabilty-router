[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[project]
name = "mcp-capability-router"
version = "1.0.0"
description = "Framework-agnostic, asyncio-first capability routing for MCP tools, resources, and prompts."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "S MUNI HARISH", email = "samamuniharish@gmail.com" },
]
keywords = [
  "agents",
  "asyncio",
  "code-mode",
  "fastmcp",
  "hybrid-search",
  "langchain",
  "mcp",
  "model-context-protocol",
  "qdrant",
  "resilience",
  "routing",
  "tool-retrieval",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "aiolimiter>=1.3.0,<2",
  "anyio>=4.16.0,<5",
  "fastmcp>=4.1.6,<5",
  "httpx2>=2.16.0,<3",
  "mcp>=2.3.0,<3",
  "purgatory>=3.0.1,<4",
  "qdrant-client>=1.20.0,<2",
  "refresh-engine>=1.0.0,<2",
  "tenacity>=9.2.1,<10",
]

[project.optional-dependencies]
langchain = [
  "langchain>=1.4.9,<2",
  "langchain-core>=1.7.6,<2",
]
codemode = ["fastmcp[code-mode]>=4.1.6,<5"]
otel = [
  "opentelemetry-api>=1.45.2,<2",
  "opentelemetry-sdk>=1.45.2,<2",
  "refresh-engine[otel]>=1.0.0,<2",
]
redis = ["purgatory[redis]>=3.0.1,<4"]
all = ["mcp-capability-router[codemode,langchain,otel,redis]"]

[project.urls]
Homepage = "https://github.com/smuniharish/mcp-capabilty-router"
Documentation = "https://mcp-capabilty-router.readthedocs.io/"
Changelog = "https://github.com/smuniharish/mcp-capabilty-router/blob/master/CHANGELOG.md"
Issues = "https://github.com/smuniharish/mcp-capabilty-router/issues"
Repository = "https://github.com/smuniharish/mcp-capabilty-router"

[dependency-groups]
test = [
  "coverage[toml]>=7.17.2",
  "hypothesis>=6.170.15",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
  "skills-ref>=0.1.1,<1",
]
lint = ["ruff>=0.17.4"]
types = ["pyrefly>=1.4.1"]
docs = [
  "griffe-pydantic>=1.3.2,<2",
  "mkdocstrings-python>=2.0.10,<3",
  "zensical>=0.1.0,<0.2",
]
examples = [
  "asyncpg>=0.32.0,<1",
  "deepagents>=0.7.34,<1",
  "langchain-openai>=1.7.4,<2",
  "langgraph>=1.2.20,<2",
  "langgraph-swarm>=0.1.0,<1",
  "openai>=3.46.0,<4",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45.2,<2",
  "prometheus-client>=0.26.0,<1",
]
package = ["twine>=7.0.0"]
audit = ["pip-audit>=2.10.1"]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "types" },
]

[tool.uv]
default-groups = ["dev"]
# google-genai, pulled in by the deepagents example, caps tenacity below the 9.2 line that
# refresh-engine requires. The override only applies to this project's development lock.
override-dependencies = ["tenacity>=9.2.1,<10"]

[tool.uv.build-backend]
module-name = "mcp_capability_router"
source-include = ["CHANGELOG.md", "tests/**"]
source-exclude = ["tests/integration/test_examples.py", "tests/skill/**"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
  "error",
  # langsmith, a LangChain dependency, calls asyncio.iscoroutinefunction at import time.
  "ignore:'asyncio.iscoroutinefunction':DeprecationWarning:langsmith",
  # py-key-value's runtime type checks emit this on Python 3.15.
  "ignore:.*isn't explicitly decorated with @runtime_checkable",
]
markers = [
  "live: tests requiring explicitly configured external services",
  "examples: tests that execute the scripts under examples/",
]
timeout = "120"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source_pkgs = ["mcp_capability_router"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "C4",
  "D",
  "DTZ",
  "E",
  "ERA",
  "F",
  "FURB",
  "I",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "TC",
  "UP",
  "W",
]
# Google style documents constructor arguments on the class, not on __init__.
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# `type` is the public keyword that filters capabilities by kind.
"src/mcp_capability_router/{contracts,models,registry,runtime}.py" = ["A002"]
"tests/**" = ["A002", "ARG", "D", "S101", "S105", "S106", "S108", "S311"]
"src/mcp_capability_router/testing.py" = ["S101"]
"examples/**" = ["A002", "ARG", "D", "S101", "T201"]
"benchmarks/**" = ["ARG", "D", "S311", "T201"]
"scripts/**" = ["ARG", "D", "S603", "S607", "T201"]
"mcp-capability-router-skills/**" = ["A002", "ARG", "D", "S101", "T201"]

[tool.pyrefly]
project-includes = [
  "src",
  "tests",
  "examples",
  "scripts",
  "benchmarks",
  "mcp-capability-router-skills",
]
search-path = [
  "src", ".", "examples", "scripts",
  "mcp-capability-router-skills/skills/mcp-capability-router-extend/assets",
]
python-version = "3.12"

[[tool.pyrefly.sub-config]]
matches = "examples/**"
errors = { bad-specialization = false }

[[tool.pyrefly.sub-config]]
matches = "tests/**"
errors = { bad-specialization = false }

[[tool.pyrefly.sub-config]]
matches = "mcp-capability-router-skills/**"
errors = { bad-specialization = false }
