[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "mcp-capability-router"
dynamic = ["version"]
description = "Asyncio-first capability routing for MCP tools, resources, and prompts in LangChain and LangGraph agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "S. Muni Harish" }]
keywords = [
  "agents",
  "asyncio",
  "fastmcp",
  "langchain",
  "langgraph",
  "mcp",
  "model-context-protocol",
  "resilience",
  "routing",
  "tool-retrieval",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "aiolimiter>=1.3.0",
  "anyio>=4.15.1",
  "fastmcp>=4.0.11",
  "httpx2>=2.13.1",
  "langchain[mcp]>=1.4.3",
  "langchain-core>=1.6.6",
  "mcp>=2.3.0",
  "numpy>=2.5.3",
  "purgatory>=3.0.1",
  "refresh-engine>=0.2.0",
  "tenacity>=9.1.4",
]

[project.urls]
Homepage = "https://github.com/smuniharish/mcp-capabilty-router"
Documentation = "https://mcp-capabilty-router.readthedocs.io"
Repository = "https://github.com/smuniharish/mcp-capabilty-router"
Issues = "https://github.com/smuniharish/mcp-capabilty-router/issues"
Changelog = "https://mcp-capabilty-router.readthedocs.io/en/latest/changelog/"

[dependency-groups]
test = [
  "coverage[toml]>=7.16.2",
  "hypothesis>=6.168.4",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "pytest-timeout>=2.4.0",
]
lint = [
  "pyrefly>=1.3.2",
  "ruff>=0.16.10",
]
docs = [
  # MkDocs 2.0 removes the plugin system that Material and mkdocstrings rely on.
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7.7",
  "mkdocstrings[python]>=1.0.6",
  "mkdocstrings-python>=2.0.9",
  "ruff>=0.16.10",
]
examples = [
  "asyncpg>=0.31.0",
  "deepagents>=0.7.21",
  "langchain-openai>=1.6.7",
  "langgraph-swarm>=0.1.0",
  "prometheus-client>=0.26.0",
]
dev = [
  { include-group = "docs" },
  { include-group = "examples" },
  { include-group = "lint" },
  { include-group = "test" },
  "pip-audit>=2.10.1",
  "pip-system-certs>=5.3",
  "twine>=7.0.0",
]

[tool.hatch.version]
path = "src/mcp_capability_router/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_capability_router"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/CHANGELOG.md",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]
# These tests run the examples, which the source distribution does not include.
exclude = ["/tests/integration/test_examples.py"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
  "error",
  # langsmith, a LangChain dependency, calls asyncio.iscoroutinefunction, which
  # Python 3.14 deprecates.
  "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]
timeout = "120"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
branch = true
source_pkgs = ["mcp_capability_router"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "^\\s*\\.\\.\\.\\s*$",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "D",
  "E",
  "ERA",
  "F",
  "FURB",
  "I",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PT",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S311"]
"examples/**" = ["D", "S101", "T201"]
"benchmarks/**" = ["D", "S311", "T201"]
"scripts/**" = ["D", "S603", "S607", "T201"]
"mcp-capability-router-skills/**" = ["T201"]

[tool.pyrefly]
project-includes = [
  "src",
  "tests",
  "examples",
  "scripts",
  "benchmarks",
  "mcp-capability-router-skills",
]
search-path = ["src", ".", "examples"]
python-version = "3.12"
