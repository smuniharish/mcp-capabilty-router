version: 2
build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  jobs:
    post_checkout:
      - curl -LsSf https://astral.sh/uv/install.sh | sh
    post_install:
      - $HOME/.local/bin/uv sync --extra docs
    build:
      html:
        - $HOME/.local/bin/uv run mkdocs build --site-dir $READTHEDOCS_OUTPUT/html

