name: Security

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  UV_LOCKED: "1"

jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --all-groups
      - name: Audit runtime dependencies
        run: |
          uv export --no-default-groups --all-extras --no-emit-project --output-file "${RUNNER_TEMP}/runtime.txt"
          uv run pip-audit --strict --disable-pip --no-deps --requirement "${RUNNER_TEMP}/runtime.txt"
      - name: Audit development dependencies
        run: |
          uv export --all-groups --all-extras --no-emit-project --output-file "${RUNNER_TEMP}/all.txt"
          uv run pip-audit --strict --disable-pip --no-deps --requirement "${RUNNER_TEMP}/all.txt"
