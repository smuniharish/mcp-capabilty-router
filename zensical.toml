[project]
site_name = "mcp-capability-router"
site_description = "Async capability routing for MCP tools, resources, and prompts."
site_url = "https://mcp-capabilty-router.readthedocs.io/en/latest/"
site_author = "S. Muni Harish"
repo_name = "smuniharish/mcp-capabilty-router"
repo_url = "https://github.com/smuniharish/mcp-capabilty-router"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; mcp-capability-router contributors. Apache License 2.0."
exclude_docs = "*.mmd"
nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = "concepts.md" },
  { "Guides" = [
    "guides/index.md",
    { "Connecting MCP servers" = "guides/servers.md" },
    { "Retrieval" = "guides/retrieval.md" },
    { "Discovery and refresh" = "guides/refresh.md" },
    { "Resilience" = "guides/resilience.md" },
    { "Metrics, logging, and health" = "guides/observability.md" },
    { "LangChain and LangGraph agents" = "guides/agents.md" },
    { "Extending the router" = "guides/extending.md" },
    { "Downstream customization" = "guides/customization.md" },
    { "Isolation and security" = "guides/security.md" },
    { "Testing integrations" = "guides/testing.md" },
    { "Performance" = "guides/performance.md" },
    { "Production checklist" = "guides/production.md" },
    { "Troubleshooting" = "guides/troubleshooting.md" },
  ] },
  { "Examples" = "examples.md" },
  { "API reference" = [
    "api/index.md",
    { "Runtime" = "api/runtime.md" },
    { "Capabilities" = "api/models.md" },
    { "Refresh policies" = "api/refresh.md" },
    { "Retrieval" = "api/retrieval.md" },
    { "Registries" = "api/registry.md" },
    { "FastMCP adapter" = "api/adapters.md" },
    { "Agent middleware" = "api/agents.md" },
    { "Extension contracts" = "api/contracts.md" },
    { "Resilience" = "api/resilience.md" },
    { "Caching, tracing, and testing" = "api/extensions.md" },
    { "Exceptions" = "api/errors.md" },
  ] },
  { "Architecture" = [
    { "Overview" = "architecture/overview.md" },
    { "Request lifecycle" = "architecture/lifecycle.md" },
  ] },
  { "Agent Skills" = "agent-skills.md" },
  { "Changelog" = "changelog.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
unresolved_references = true
unresolved_footnotes = true

[project.theme]
font = false
icon.repo = "fontawesome/brands/github"
features = [
  "content.action.edit", "content.code.copy", "content.tabs.link",
  "navigation.footer", "navigation.indexes", "navigation.sections",
  "navigation.top", "navigation.tracking", "search.highlight", "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-night"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
accent = "deep purple"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to light mode"

[project.plugins.glightbox]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
extensions = [{ griffe_pydantic = { schema = false } }]
show_source = false
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
merge_init_into_class = true
separate_signature = true
show_signature_annotations = true
signature_crossrefs = false
members_order = "source"
heading_level = 2

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
"pymdownx.details" = {}
"pymdownx.highlight".anchor_linenums = true
"pymdownx.inlinehilite" = {}
"pymdownx.snippets" = { base_path = ["."], check_paths = true }
"pymdownx.superfences" = {}
"pymdownx.tabbed".alternate_style = true
